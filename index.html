<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Monopoli Arcand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap">
<style>
/* Layout: meja kayu 3D layar penuh, chip pemain di atas, dok dadu di bawah, kartu kertas sebagai modal. Satu tampilan malam yang hangat. */
:root{
  color-scheme: dark;
  --teak:#1b120c; --teak-2:#2a1b12; --teak-3:#3b281a;
  --paper:#f6ebcf; --paper-2:#eadbb3; --paper-3:#dcc995;
  --ink:#2a1d12; --ink-2:#6a5640;
  --merah:#c8302a; --merah-2:#97211c; --emas:#e6a93a; --mint:#cfe5cf; --biru:#1f4fa8;
  --font-display:'Alfa Slab One', Rockwell, Georgia, serif;
  --font-body:'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --shadow:0 10px 30px rgba(0,0,0,.45);
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--teak);color:var(--paper);font-family:var(--font-body);overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--emas);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:absolute;inset:0}
#stage canvas{display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;right:0;top:0;z-index:5;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:start;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px));pointer-events:none}
#hud[hidden]{display:none!important}
#hud>*{pointer-events:auto}
.chip{--c:#888;background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 10px;display:flex;gap:9px;align-items:center;box-shadow:var(--shadow);
  border:2px solid transparent;min-width:0;transition:transform .35s cubic-bezier(.3,1.6,.5,1),border-color .3s,box-shadow .3s;position:relative}
.chip.right{flex-direction:row-reverse;text-align:right}
.chip.active{border-color:var(--c);transform:translateY(3px);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),var(--shadow)}
.chip.out{opacity:.5;filter:grayscale(1)}
.tok{flex:none;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff8 0 18%,transparent 19%),var(--c);box-shadow:inset 0 -3px 0 #0003}
.chip .info{min-width:0;display:flex;flex-direction:column;gap:1px}
.chip .nm{font-weight:800;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;gap:5px;align-items:center}
.chip.right .nm{justify-content:flex-end}
.chip .me{font-size:9px;letter-spacing:.08em;background:var(--ink);color:var(--paper);padding:1px 5px;border-radius:4px;font-weight:700}
.chip .money{font-family:var(--font-display);font-size:18px;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:.01em}
.chip .meta{font-size:10.5px;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.float{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-family:var(--font-display);font-size:18px;pointer-events:none;
  text-shadow:0 2px 0 #0008;animation:floatUp 1.4s ease-out forwards;white-space:nowrap}
.float.plus{color:#7ee08a}.float.minus{color:#ff8a7a}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-6px) scale(.7)}15%{opacity:1;transform:translate(-50%,4px) scale(1.15)}100%{opacity:0;transform:translate(-50%,34px) scale(1)}}
.mid{display:flex;flex-direction:column;align-items:center;gap:6px}
.iconrow{display:flex;gap:6px}
.ibtn{width:36px;height:36px;border-radius:11px;border:0;background:var(--teak-3);color:var(--paper);display:grid;place-items:center;box-shadow:inset 0 -2px 0 #0005}
.ibtn svg{width:18px;height:18px}
.ibtn.music .slash{display:none}
.ibtn.music[aria-pressed="false"]{color:var(--paper-3);opacity:.75}
.ibtn.music[aria-pressed="false"] .slash{display:inline}
.lobtoggles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.musictoggle{align-self:center;background:none;border:1.5px solid #f6ebcf55;color:var(--paper-2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:12.5px}
.pot{font-size:10.5px;font-weight:700;color:var(--paper-3);text-align:center;line-height:1.2;max-width:96px}
.pot b{display:block;font-family:var(--font-display);font-weight:400;font-size:13px;color:var(--emas)}

/* ---------- Toast & stamp ---------- */
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 92px);transform:translateX(-50%);z-index:6;pointer-events:none;
  background:#000b;color:var(--paper);padding:8px 14px;border-radius:999px;font-weight:700;font-size:13px;max-width:calc(100% - 32px);text-align:center;
  opacity:0;transition:opacity .25s,transform .25s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(4px)}
#stamp{position:absolute;left:50%;top:40%;z-index:7;pointer-events:none;font-family:var(--font-display);font-size:clamp(34px,10vw,64px);color:var(--c,#c8302a);
  padding:4px 18px;border:6px solid currentColor;border-radius:14px;background:#f6ebcfe6;opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(2.2);white-space:nowrap}
#stamp.go{animation:stamp 1.5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(2.4)}18%{opacity:1;transform:translate(-50%,-50%) rotate(-9deg) scale(1)}75%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(-9deg) scale(.95)}}
#diceResult{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 132px);transform:translateX(-50%);z-index:6;pointer-events:none;
  background:var(--paper);color:var(--ink);border-radius:14px;padding:8px 14px;box-shadow:var(--shadow);text-align:center;opacity:0;transition:opacity .3s,transform .3s}
#diceResult.show{opacity:1;transform:translateX(-50%) translateY(-6px)}
#diceResult .sum{font-family:var(--font-display);font-size:26px;line-height:1}
#diceResult .acc{font-size:11.5px;font-weight:700;color:var(--ink-2);margin-top:3px;white-space:nowrap}
#diceResult .acc.hit{color:#1d8a46}

/* ---------- Dock ---------- */
#dock{position:absolute;left:50%;transform:translateX(-50%);bottom:0;z-index:5;width:min(460px,100%);
  padding:0 max(12px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 12px) max(12px,env(safe-area-inset-left,0px))}
#dock[hidden]{display:none!important}
.dcard{background:var(--paper);color:var(--ink);border-radius:18px;padding:12px 14px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.dhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.dhead .who{font-weight:800;font-size:14px;display:flex;align-items:center;gap:7px;min-width:0}
.dhead .who i{width:12px;height:12px;border-radius:50%;background:var(--c);flex:none}
.dhead .hint{font-size:11px;color:var(--ink-2);font-weight:600;text-align:right}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--paper-2);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;padding:8px 4px;border-radius:9px;font-weight:800;font-size:13px;color:var(--ink-2)}
.seg button[aria-checked="true"]{background:var(--ink);color:var(--paper);box-shadow:0 2px 0 #0004}
.gauge{display:flex;flex-direction:column;gap:3px}
.track{position:relative;height:22px;border-radius:11px;overflow:hidden;background:linear-gradient(90deg,#3fa7c9 0%,#5cc28a 30%,#f2cf1d 55%,#f08a24 78%,#d8322c 100%);box-shadow:inset 0 2px 4px #0006}
.track .fill{position:absolute;inset:0 auto 0 0;width:0;background:#fff5;mix-blend-mode:overlay}
.track .ticks{position:absolute;inset:0;display:grid;grid-template-columns:repeat(11,1fr)}
.track .ticks i{border-right:1px solid #0003}
.track .needle{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;left:0;background:var(--ink);border-radius:3px;box-shadow:0 0 0 2px var(--paper)}
.scale{display:grid;grid-template-columns:repeat(11,1fr);font-size:10px;font-weight:800;color:var(--ink-2);text-align:center;font-variant-numeric:tabular-nums}
.scale span:first-child{text-align:left}.scale span:last-child{text-align:right}
.scale-l{display:flex;justify-content:space-between;font-size:9.5px;letter-spacing:.1em;font-weight:800;color:var(--ink-2)}
.roll{border:0;border-radius:14px;padding:15px 10px;font-family:var(--font-display);font-size:19px;letter-spacing:.03em;color:#fff;
  background:linear-gradient(180deg,var(--merah),var(--merah-2));box-shadow:0 5px 0 #5e1310, 0 8px 18px #0006;touch-action:none;-webkit-touch-callout:none;transition:transform .08s,box-shadow .08s}
.roll.hold{transform:translateY(4px);box-shadow:0 1px 0 #5e1310,0 3px 8px #0006}
.roll:disabled{filter:grayscale(.6) brightness(.8);cursor:default}
.lgr{display:flex;flex-direction:column;align-items:center}
.arc{width:100%;max-width:330px;height:auto;overflow:visible;display:block}
.lgr-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;width:100%;max-width:340px;margin-top:-30px}
.pill{border:0;border-radius:999px;padding:12px 6px;font-family:var(--font-display);font-size:15px;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,#6fb4ff,#2f6fe0);box-shadow:0 4px 0 #1b4594,0 6px 12px #0004;opacity:.72;transition:transform .12s,opacity .12s,box-shadow .12s}
.pill[aria-pressed="true"]{opacity:1;transform:translateY(2px) scale(1.05);box-shadow:0 2px 0 #1b4594,0 0 0 4px var(--emas),0 6px 14px #0005}
.roll.round{width:104px;height:104px;border-radius:50%;padding:0;font-size:19px;line-height:1.05;
  background:radial-gradient(circle at 35% 30%,#ff8fc8 0 12%,transparent 13%),linear-gradient(180deg,#e04d9c,#b21f6c);box-shadow:0 6px 0 #6e0f40,0 10px 22px #0006}
.roll.round.hold{transform:translateY(5px) scale(.97);box-shadow:0 1px 0 #6e0f40,0 4px 10px #0006}
.lgr-hint{font-size:11px;font-weight:700;color:var(--paper);text-shadow:0 1px 3px #000,0 0 8px #000;margin-top:8px;text-align:center}
/* panel bar transparan: hanya busur dan tombol yang terlihat di atas papan */
.dcard.clear{background:transparent;box-shadow:none;padding:0 0 2px;gap:6px}
.dpill{align-self:center;display:flex;gap:7px;align-items:center;max-width:100%;background:#1b120cd9;color:var(--paper);padding:6px 13px;border-radius:999px;font-weight:800;font-size:12.5px;box-shadow:0 4px 12px #0005}
.dpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dpill i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
.dots.light i{background:#fff}
.arc{filter:drop-shadow(0 6px 10px #0007)}
.lgr.idle .pill{opacity:.45}
.lgr.idle .pill[aria-pressed="true"]{opacity:.85}
.lgr.idle .roll.round:disabled{filter:saturate(.55) brightness(.85)}
.pill:disabled{cursor:default}
.pill{position:relative}
.pill .qb{position:absolute;top:-7px;right:-4px;width:20px;height:20px;border-radius:50%;background:var(--emas);color:var(--ink);font-style:normal;font-family:var(--font-body);font-weight:800;font-size:11px;display:grid;place-items:center;box-shadow:0 0 0 2px var(--paper),0 2px 4px #0005}
#arcKnob circle:first-child{transform-box:fill-box;transform-origin:center}
#arcKnob.pulse circle:first-child{animation:knob .62s ease-out}
@keyframes knob{0%{transform:scale(1)}35%{transform:scale(1.7);fill:#ffd56b}100%{transform:scale(1)}}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 48%,color-mix(in srgb,var(--c,#ffd56b) 55%,#fff) 0,transparent 55%)}
#flash.go{animation:flash .62s ease-out}
@keyframes flash{0%{opacity:0}30%{opacity:.55}100%{opacity:0}}
.jailrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:var(--paper);color:var(--ink);border:1.5px dashed #c56a12;border-radius:12px;padding:8px}
.jailrow p{flex:1 1 140px;font-size:12px;font-weight:700;margin:0}
.btn{border:0;border-radius:11px;padding:10px 14px;font-weight:800;font-size:13.5px;background:var(--ink);color:var(--paper);box-shadow:0 3px 0 #0006}
.btn.ghost{background:var(--paper-2);color:var(--ink);box-shadow:0 3px 0 var(--paper-3)}
.btn.red{background:var(--merah);color:#fff;box-shadow:0 3px 0 var(--merah-2)}
.btn.gold{background:var(--emas);color:var(--ink);box-shadow:0 3px 0 #a0711c}
.btn:disabled{opacity:.45;cursor:default}
.wait{display:flex;align-items:center;gap:10px;font-weight:700;font-size:13.5px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-2);animation:bop 1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bop{0%,100%{opacity:.25;transform:translateY(0)}50%{opacity:1;transform:translateY(-4px)}}

/* ---------- Modal ---------- */
/* flex + margin:auto: berada di tengah kalau muat, dan tidak terpotong atasnya kalau layar pendek (landscape) */
#modal>*{margin:auto}
#modal{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;background:#0008;backdrop-filter:blur(2px);
  padding:calc(env(safe-area-inset-top,0px) + 16px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{width:min(360px,100%);background:var(--paper);color:var(--ink);border-radius:18px;padding:16px;box-shadow:var(--shadow);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85) translateY(20px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{font-family:var(--font-display);font-weight:400;font-size:22px;margin:0 0 4px;text-wrap:balance}
.sheet .sub{font-size:12.5px;color:var(--ink-2);font-weight:600;margin:0 0 12px}
.actions{display:flex;gap:8px;margin-top:14px}.actions .btn{flex:1}
.deed{background:#fffaf0;border:2px solid var(--ink);border-radius:6px;padding:6px;box-shadow:4px 4px 0 #0002}
.deed .dh{background:var(--g,#ccc);color:var(--gt,#fff);border:2px solid var(--ink);text-align:center;padding:7px 6px 8px}
.deed .dh small{display:block;font-size:9.5px;letter-spacing:.14em;font-weight:800;opacity:.9}
.deed .dh b{display:block;font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.02em;line-height:1.1}
.deed .dh span{font-size:11px;font-weight:700;opacity:.9}
.deed table{width:100%;border-collapse:collapse;margin-top:6px;font-size:13px;font-variant-numeric:tabular-nums}
.deed td{padding:3.5px 6px;color:var(--ink)}.deed td:last-child{text-align:right;font-weight:800}
.deed tr.hl td{background:#f2cf1d66}
.deed tr.cur td{background:#1f9d5533}
.deed .foot{border-top:1.5px solid var(--ink);margin-top:6px;padding-top:6px;font-size:11.5px;text-align:center;font-weight:600;color:var(--ink-2)}
.picklist{display:flex;flex-direction:column;gap:6px;max-height:52vh;overflow-y:auto;margin-top:4px;padding-right:2px}
.pick{display:flex;align-items:center;gap:10px;text-align:left;border:2px solid var(--paper-3);background:#fffaf0;color:var(--ink);border-radius:11px;padding:8px 10px}
.pick:hover,.pick:focus-visible{border-color:var(--merah)}
.pick .sw,.tinfo .sw,.pickinfo .sw{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--ink);flex:none}
.pick .tn,.pickinfo .tn{flex:1;min-width:0;font-weight:800;font-size:13px;display:flex;flex-direction:column}
.pick .tn em,.pickinfo .tn em{font-style:normal;font-weight:600;font-size:11px;color:var(--ink-2)}
.pick .up,.pickinfo .up{font-size:11.5px;color:#1d8a46;white-space:nowrap}
/* panel memilih tempat di dok (pengganti pop-up) */
.pickdock{align-self:center;width:min(420px,100%);display:flex;flex-direction:column;gap:8px;background:var(--paper);color:var(--ink);border-radius:16px;padding:10px 12px;box-shadow:var(--shadow)}
.pickinfo{display:flex;align-items:center;gap:10px;min-height:38px}
.pickinfo .ph{font-weight:700;font-size:13px;color:var(--ink-2);line-height:1.4}
.pickdock .ph2{font-size:11px;font-weight:600;color:var(--ink-2)}
.pickbtns{display:flex;gap:8px}.pickbtns .btn{flex:1}
.tinfo p{margin:10px 0 0;font-size:13.5px;line-height:1.5}
.here{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.here span{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;color:#fff;background:var(--c)}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:6px;margin-top:12px}
.tiers button{border:2px solid var(--paper-3);background:#fffaf0;color:var(--ink);border-radius:11px;padding:8px 4px;display:flex;flex-direction:column;gap:2px;align-items:center;font-variant-numeric:tabular-nums}
.tiers button b{font-size:12.5px;font-weight:800;text-align:center;line-height:1.15}
.tiers button span{font-size:11px;font-weight:700;color:var(--ink-2)}
.tiers button[aria-checked="true"]{border-color:var(--merah);background:#c8302a14;box-shadow:0 0 0 2px var(--merah)}
.tiers button:disabled{opacity:.4;cursor:default}
.due{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;padding:10px 12px;border-radius:12px;background:#c8302a14;border:2px dashed var(--merah)}
.due span{font-size:12.5px;font-weight:800;color:var(--merah)}
.due b{font-family:var(--font-display);font-weight:400;font-size:24px;color:var(--merah);font-variant-numeric:tabular-nums}
.bal{display:flex;justify-content:space-between;font-size:12.5px;font-weight:700;margin-top:12px;padding:8px 10px;background:var(--paper-2);border-radius:10px;font-variant-numeric:tabular-nums}
.bal b{font-family:var(--font-display);font-weight:400}

.cardwrap{perspective:900px;width:min(300px,86vw);aspect-ratio:1.55;cursor:pointer}
.gcard{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip .9s cubic-bezier(.3,1.3,.5,1) .15s forwards;transform:rotateY(180deg) scale(.6)}
@keyframes flip{to{transform:rotateY(0) scale(1)}}
.gcard .face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:16px 18px;text-align:center;border:3px solid var(--ink);box-shadow:var(--shadow)}
.gcard .front{background:#fffaf0;color:var(--ink)}
.gcard .front small{font-family:var(--font-display);font-size:16px;letter-spacing:.05em;color:var(--kc)}
.gcard .front p{font-size:15.5px;font-weight:700;margin:8px 0 0;line-height:1.35;text-wrap:balance}
.gcard .back{transform:rotateY(180deg);background:var(--kc);color:#fff;font-family:var(--font-display);font-size:64px}
.gcard.k-ch{--kc:#e07a14}.gcard.k-cc{--kc:#2563b8}.gcard.k-sp{--kc:#7a3fc4}
.gcard.k-sp .back{background:repeating-linear-gradient(45deg,#7a3fc4 0 14px,#8f55d8 14px 28px);font-size:58px;letter-spacing:.05em}
.gcard.k-sp.good .front{background:linear-gradient(180deg,#eafbef,#fffaf0)}
.gcard.k-sp.bad .front{background:linear-gradient(180deg,#fdeaea,#fffaf0)}
.ctag{display:inline-block;margin-top:12px;padding:4px 10px;border-radius:999px;font-size:10.5px;font-weight:800;letter-spacing:.12em;color:#fff;background:#6a5640}
.ctag.untung{background:#1d8a46}.ctag.rugi{background:var(--merah)}.ctag.jalan{background:#2563b8}
.taphint{text-align:center;font-size:11px;color:var(--paper-3);margin-top:10px;font-weight:600}

.menu-list{display:flex;flex-direction:column;gap:8px}
.menu-list .btn{text-align:left}
.plist{display:flex;flex-direction:column;gap:12px;max-height:60vh;overflow-y:auto}
.plist h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center;gap:6px}
.plist h3 i{width:12px;height:12px;border-radius:50%;background:var(--c)}
.prow{display:flex;align-items:center;gap:8px;font-size:12.5px;padding:5px 0;border-bottom:1px dashed var(--paper-3)}
.prow .sw{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--ink);flex:none}
.prow span:nth-child(2){flex:1;font-weight:700}
.prow em{font-style:normal;font-weight:700;color:var(--ink-2);font-size:11.5px}
.log{max-height:55vh;overflow-y:auto;font-size:12.5px;display:flex;flex-direction:column-reverse;gap:6px}

let soundOn = lsGet('mn_sound') !== '0';      // efek suara

/* ---------- Musik latar: lagu pendek bergaya gamelan, diputar berulang ----------
   Tangga nada pentatonis (D E G A B), 108 ketukan per menit, pola A A B A (128 langkah 1/8). */
const MUSIC = {
  step:60 / 108 / 2,
  scale:[62, 64, 67, 69, 71, 74, 76, 79],
  A:[4,-1,3,-1, 2,-1,3,4, 5,-1,4,-1, 3,-1,-1,-1,  2,-1,1,-1, 0,-1,1,2, 3,-1,2,-1, 1,-1,-1,-1],
  B:[5,-1,6,-1, 7,-1,6,5, 4,-1,5,-1, 6,-1,-1,-1,  5,-1,4,-1, 3,-1,2,3, 4,-1,1,-1, 0,-1,-1,-1],
  rootsA:[50, 43, 45, 50], rootsB:[43, 50, 45, 50],
  order:['A', 'A', 'B', 'A'],
};
const musicState = { timer:null, next:0, i:0 };
function playMusicStep(i, t) {
  const a = AC, when = t - a.currentTime, bus = musicBus;
  const ph = MUSIC.order[Math.floor(i / 32) % 4], k = i % 32, bar = Math.floor(k / 8), s = k % 8;
  const mel = MUSIC[ph][k];
  if (mel >= 0) saron(MUSIC.scale[mel], .075, when, bus);
  // bonang: gema satu oktaf di atas, tipis, pada ketukan genap tertentu
  if (mel >= 0 && s % 4 === 0) saron(MUSIC.scale[mel] + 12, .025, when + MUSIC.step * .5, bus, .4);
  const root = (ph === 'B' ? MUSIC.rootsB : MUSIC.rootsA)[bar];
  if (s === 0) tone(midi(root), 1.1, 'sine', .13, when, bus);
  if (s === 4) tone(midi(root + 7), .8, 'sine', .09, when, bus);
  // kendang: "dhung" rendah dan "tak" tinggi
  if (s === 0 || s === 3 || s === 6) sweep(170, 85, .14, 'sine', .11, when, bus);
  if (s === 2 || s === 5 || s === 7) noise(.04, .05, when, 1900, bus, 2);
  if (s % 2 === 1) noise(.03, .018, when, 8000, bus);
  if (k === 0) gong(.07, when, bus);
}
function musicStart() {
  if (!musicOn || musicState.timer || document.hidden) return;
  const a = ac(); if (!a) return;
  musicState.next = a.currentTime + .15;
  musicState.timer = setInterval(() => {
    if (!AC) return;
    if (musicState.next < AC.currentTime) musicState.next = AC.currentTime + .05;   // kembali dari jeda, jangan kejar ketinggalan
    while (musicState.next < AC.currentTime + .3) {
      playMusicStep(musicState.i, musicState.next);
      musicState.i = (musicState.i + 1) % 128; musicState.next += MUSIC.step;
    }
  }, 60);
}
function musicStop() { clearInterval(musicState.timer); musicState.timer = null; }
function setMusic(on) {
  musicOn = on; lsSet('mn_music', on ? '1' : '0');
  if (on) musicStart(); else musicStop();
  document.querySelectorAll('[data-music]').forEach(el => el.setAttribute('aria-pressed', on));
}

function fitLines(x, text, maxW, size, weight, font) {
  let s = size, lines;
  for (;;) {
    x.font = `${weight} ${s}px ${font}`;
    const words = text.split(' ');
    if (words.some(w => x.measureText(w).width > maxW) && s > 12) { s -= 1; continue; }
    lines = []; let cur = '';
    for (const w of words) { const t = cur ? cur + ' ' + w : w; if (x.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
    lines.push(cur);
    if (lines.length > 3 && s > 12) { s -= 1; continue; }
    return { lines, size:s };
  }
}
function textBlock(x, text, cx, y, maxW, size, weight = 800, font = FB, color = INK) {
  const r = fitLines(x, text, maxW, size, weight, font);
  x.fillStyle = color; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  r.lines.forEach((l, k) => x.fillText(l, cx, y + k * r.size * 1.1));
  return y + (r.lines.length - 1) * r.size * 1.1;
}

async function playFx(list, st) {
  const names = st.players.map(p => p.name), hx = hexesOf(st);
  userCam = false;   // tiap langkah baru boleh zoom otomatis lagi; sudut kamera pemain tetap dipakai
  for (const f of list) {
    switch (f.t) {
      case 'dice':
        // pemain lain ikut melihat jarum berhenti di posisi lemparan
        if (typeof f.g === 'number') gaugeP = f.g;
        shownPref = f.pref; renderDock();
        await diceIntro(hx[f.p]);
        await throwDice(f.d); showDiceResult(f); await sleep(380); break;
      case 'move': await movePawn(f.p, f.from, f.steps); break;
      case 'jail': await flyToJail(f.p); toast(`${names[f.p]} masuk penjara!`); await sleep(500); break;
      case 'gain': {
        sfx.gain();
        const to = pawns[f.p].position.clone(); to.y = .3;
        await coinsFly(f.fromPot ? new THREE.Vector3(0, .3, 0) : new THREE.Vector3(to.x * .3, 3, to.z * .3), to, f.amt >= 150 ? 10 : 6);
        moneyDelta(f.p, f.amt); toast(`${names[f.p]} +${fmt(f.amt)} · ${f.why}`);
        await sleep(350); break;
      }
      case 'pay': {
        sfx.pay();
        const from = pawns[f.from].position.clone(); from.y = .3;
        const to = f.to >= 0 ? pawns[f.to].position.clone() : new THREE.Vector3(0, .3, 0);
        await coinsFly(from, to, f.amt >= 200 ? 10 : 6);
        moneyDelta(f.from, -f.amt); if (f.to >= 0) moneyDelta(f.to, f.amt);
        toast(`${names[f.from]} bayar ${fmt(f.amt)} · ${f.why}`);
        if (f.to >= 0 && f.amt >= 200) stamp('MAHAL!', '#c8302a');
        await sleep(450); break;
      }
      case 'buy':
        sfx.buy();
        stamp(f.amt ? 'DIBELI!' : 'GRATIS!', hx[f.p]);
        if (f.amt) moneyDelta(f.p, -f.amt);
        await animBuy(f.tile, f.p, hx);
        toast(`${names[f.p]} sekarang punya ${T[f.tile].n}`);
        await sleep(300); break;
      case 'fly':
        sfx.whoosh();
        await flyPawn(f.p, f.to);
        toast(`${names[f.p]} mendarat di ${T[f.to].n}`);
        await sleep(300); break;
      case 'swap':
        sfx.whoosh();
        await Promise.all([flyPawn(f.a, f.pa), flyPawn(f.b, f.pb, false)]);
        toast(`${names[f.a]} dan ${names[f.b]} bertukar tempat!`);
        await sleep(400); break;
      case 'surprise': await showCard({ k:'sp', good:f.good, text:f.text }); break;
      case 'build':
        stamp(f.lv === LANDMARK_LV ? 'LANDMARK!' : LEVEL_NAMES[f.lv].toUpperCase() + '!', hx[f.p]);
        if (f.amt) moneyDelta(f.p, -f.amt); else toast('Naik tingkat gratis!');
        await animBuild(f.tile, f.lv);
        toast(f.lv === LANDMARK_LV ? `${LANDMARKS[f.tile][0]} berdiri di ${T[f.tile].n}!` : `${T[f.tile].n} sekarang ${LEVEL_NAMES[f.lv].toLowerCase()}`);
        await sleep(f.lv === LANDMARK_LV ? 900 : 300); break;
      case 'sell': {
        const o = st.own[f.tile];
        toast(`Aset di ${T[f.tile].n} dijual untuk menutup utang`);
        if (o) setOwner(f.tile, o.o, o.lv, hx); else setOwner(f.tile, -1, 0, hx);
        await sleep(600); break;
      }
      case 'card': await showCard(f); break;
      case 'msg': toast(f.text); await sleep(1100); break;
      case 'over': sfx.win(); break;
    }
  }
  // selesai: kamera mundur lagi ke tampilan seluruh papan
  endFollow();
}

// titik di permukaan papan -> nomor petak (kebalikan dari tileLocal + rot)
function tileAt(x, z) {
  const h = S / 2;
  if (Math.abs(x) > h || Math.abs(z) > h) return -1;
  if (Math.abs(x) < h - C && Math.abs(z) < h - C) return -1;   // area tengah papan
  for (let s = 0; s < 4; s++) {
    const [lx, lz] = rot(x, z, -s);
    if (lz < h - C) continue;                                  // bukan sisi bawah setelah diputar
    if (lx > h - C) return s * 10;                             // sudut kanan bawah = sudut sisi ini
    if (lx < -(h - C)) return ((s + 1) * 10) % 40;             // sudut kiri bawah = sudut sisi berikutnya
    return s * 10 + Math.min(9, Math.max(1, Math.ceil((h - C - lx) / W)));
  }
  return -1;
}

      <button class="ticket primary" data-act="l:goOnline" ${onBtn ? '' : 'disabled'}><b>Main online</b><span>Masing-masing pakai HP sendiri</span></button>
      <button class="ticket" data-act="l:goLocal"><b>Main berdua di satu HP</b><span>Gantian pegang perangkat</span></button>
      <div class="lobtoggles"><button class="musictoggle" data-music aria-pressed="${musicOn}">♪ Musik: ${musicOn ? 'nyala' : 'mati'}</button>
      ${FS_OK ? `<button class="musictoggle" data-fs>⛶ Layar penuh</button>` : ''}</div>
      <p class="note">${onlineState === 'checking' ? 'Memeriksa mode online…'
        : onlineState === 'off' ? 'Mode online belum tersedia di alamat ini. Main berdua di satu HP tetap bisa.'
        : onlineKind === 'server' ? 'Mode online: buka alamat ini di HP masing-masing. Satu orang membuat room, satunya memasukkan kode.'
        : 'Mode online: kalian berdua membuka link halaman ini dari akun claude.ai masing-masing.'}</p>`;
  } else if (lobbyView === 'local') {
    h = `${logo}<div class="panel"><h3>Pemain 1</h3><input type="text" id="inName" maxlength="14" placeholder="Nama kamu" value="${esc(prefs.name)}">${swatches('color', prefs.color2)}</div>
      <div class="panel"><h3>Pemain 2</h3><input type="text" id="inName2" maxlength="14" placeholder="Nama pasangan" value="${esc(prefs.name2)}">${swatches('color2', prefs.color)}</div>
      ${err}<button class="ticket primary" data-act="l:startLocal"><b>Mulai main</b><span>Uang awal ${fmt(START_MONEY)} per orang</span></button>
      <button class="back" data-act="l:home">← Kembali</button>`;
  } else if (lobbyView === 'online') {
    h = `${logo}<div class="panel"><h3>Kamu</h3><input type="text" id="inName" maxlength="14" placeholder="Nama kamu" value="${esc(prefs.name)}">${swatches('color')}</div>
      ${err}<button class="ticket primary" data-act="l:create"><b>Buat room baru</b><span>Dapat kode 4 huruf untuk pasanganmu</span></button>
      <div class="panel"><h3>Punya kode dari pasangan?</h3><div class="row"><input type="text" id="inCode" maxlength="4" placeholder="KODE" style="text-transform:uppercase;letter-spacing:.2em;text-align:center"><button class="btn red" data-act="l:join" style="flex:0 0 auto">Gabung</button></div></div>
      <button class="back" data-act="l:home">← Kembali</button>`;
  } else if (lobbyView === 'waiting') {
    h = `${logo}<div class="panel" style="text-align:center"><h3>KODE ROOM</h3><div class="code" id="codeTxt">${esc(roomCode)}</div>
      <p class="sub" style="margin:0;font-size:13px;color:var(--ink-2)">Minta pasanganmu membuka halaman ini, pilih <b>Main online</b>, lalu masukkan kode ini.</p>
      <button class="btn ghost" data-act="l:copy">Salin kode</button>
      <div class="wait" style="justify-content:center"><span class="dots"><i></i><i></i><i></i></span> Menunggu pasangan bergabung…</div></div>
      <button class="back" data-act="l:leave">← Batalkan</button>`;
  } else if (lobbyView === 'takeover') {
    const st = pendingRoom;
    h = `${logo}<div class="panel"><h3>Room ${esc(roomCode)} sudah penuh</h3><p class="sub" style="margin:0;color:var(--ink-2)">Kalau kamu salah satu pemainnya tapi ganti perangkat, pilih namamu untuk melanjutkan.</p>
      ${st.players.map((p, k) => `<button class="btn ghost" data-act="l:take" data-k="${k}">Saya ${esc(p.name)}</button>`).join('')}</div>
      <button class="back" data-act="l:home">← Kembali</button>`;
  }
  L.innerHTML = `<div class="lob">${h}</div>`;
  controls.autoRotate = true; controls.autoRotateSpeed = .6;
}
function readName(id, fallback) { const el = $(id); const v = (el && el.value || '').trim().slice(0, 14); return v || fallback; }
function genCode() { const A = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s = ''; for (let i = 0; i < 4; i++) s += A[Math.floor(Math.random() * A.length)]; return s; }

function enterGame() {
  lobbyView = 'none'; renderLobby();
  controls.autoRotate = false;
  camGoal.set(0, 0, 0);
  renderUI(); layout(); resetCam(false);
}
function exitToLobby() {
  if (unsub) { unsub(); unsub = null; }
  roomRef = null; mode = null; S0 = null; shownSeq = -1; queue.length = 0;
  pawns.forEach(p => p.visible = false); dice.forEach(d => d.visible = false);
  for (const k in markers) setOwner(+k, -1, 0, []);
  lobbyView = 'home'; lobbyErr = '';
  renderLobby(); renderUI();
}

async function lobbyAct(a, b) {
  ac();
  lobbyErr = '';
  const keepName = () => { const n = $('#inName'); if (n) { prefs.name = n.value.trim(); lsSet('mn_name', prefs.name); } const n2 = $('#inName2'); if (n2) { prefs.name2 = n2.value.trim(); lsSet('mn_name2', prefs.name2); } };
  switch (a) {
    case 'home': lobbyView = 'home'; renderLobby(); break;
    case 'goLocal': lobbyView = 'local'; renderLobby(); break;
    case 'goOnline': lobbyView = 'online'; renderLobby(); break;
    case 'color': keepName(); prefs[b.dataset.key] = b.dataset.c; lsSet('mn_' + b.dataset.key, b.dataset.c); renderLobby(); break;
    case 'startLocal': {
      keepName();
      if (prefs.color === prefs.color2) { lobbyErr = 'Pilih warna pion yang berbeda.'; renderLobby(); return; }
      mode = 'local';
      const st = newGame([{ id:'p0', name:prefs.name || 'Pemain 1', color:prefs.color }, { id:'p1', name:prefs.name2 || 'Pemain 2', color:prefs.color2 }], 1);
      lsSet('mn_local', JSON.stringify(st));
      S0 = null; shownSeq = -1; enterGame(); receive(st); break;
    }
    case 'resumeLocal': {
      try { const st = JSON.parse(lsGet('mn_local')); mode = 'local'; S0 = null; shownSeq = -1; enterGame(); receive(st); }
      catch (e) { lsDel('mn_local'); renderLobby(); }
      break;
    }
    case 'create': {
      keepName();
      if (!DB) return;
      const code = genCode();
      const st = { v:1, seq:1, phase:'lobby', players:[{ id:myId, name:prefs.name || 'Pemain 1', color:prefs.color }], fx:[], log:[] };
      try { await DB.doc('rooms/' + code).set(st); }
      catch (e) { lobbyErr = onlineKind === 'server' ? serverErr(e, 'Room gagal dibuat. Cek koneksi internet lalu coba lagi.') : 'Room gagal dibuat. Pastikan kamu masuk ke claude.ai dan punya akses edit.'; renderLobby(); return; }
      roomCode = code; lsSet('mn_room', code); attachRoom(code);
      lobbyView = 'waiting'; renderLobby(); break;
    }
    case 'join': {
      keepName();
      const code = (($('#inCode') || {}).value || '').trim().toUpperCase();
      if (code.length !== 4) { lobbyErr = 'Kode room terdiri dari 4 huruf.'; renderLobby(); return; }
      await joinRoom(code); break;
    }
    case 'resumeRoom': await joinRoom(lsGet('mn_room')); break;
    case 'copy': {
      try { await navigator.clipboard.writeText(roomCode); b.textContent = 'Tersalin!'; }
      catch (e) { const r = document.createRange(); r.selectNodeContents($('#codeTxt')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = 'Kode sudah diblok, salin manual'; }
      break;
    }
    case 'leave': if (unsub) { unsub(); unsub = null; } lsDel('mn_room'); roomRef = null; lobbyView = 'home'; renderLobby(); break;
    case 'take': {
      const k = +b.dataset.k, st = begin(pendingRoom);
      st.players[k].id = myId;
      try { await DB.doc('rooms/' + roomCode).set(st); lsSet('mn_room', roomCode); attachRoom(roomCode); }
      catch (e) { lobbyErr = 'Gagal masuk ke room.'; renderLobby(); }
      break;
    }
  }
}
async function joinRoom(code) {
  if (!DB || !code) return;
  let snap;
  try { snap = await DB.doc('rooms/' + code).get(); }
  catch (e) { lobbyErr = 'Tidak bisa terhubung. Coba lagi sebentar.'; lobbyView = 'online'; renderLobby(); return; }
  if (!snap.exists) { lobbyErr = `Room ${code} tidak ditemukan.`; if (lsGet('mn_room') === code) lsDel('mn_room'); lobbyView = 'online'; renderLobby(); return; }
  const st = JSON.parse(JSON.stringify(snap.data()));
  roomCode = code;
  if (st.phase === 'lobby') {
    if (st.players[0].id === myId) { lsSet('mn_room', code); attachRoom(code); lobbyView = 'waiting'; renderLobby(); return; }
    let color = prefs.color;
    if (color === st.players[0].color) color = COLORS.find(c => c.id !== st.players[0].color).id;
    const game = newGame([st.players[0], { id:myId, name:prefs.name || 'Pemain 2', color }], st.seq + 1);
    try { await DB.doc('rooms/' + code).set(game); }
    catch (e) { lobbyErr = onlineKind === 'server' ? serverErr(e, 'Gagal bergabung. Cek koneksi internet lalu coba lagi.') : 'Gagal bergabung. Pastikan kamu punya akses edit ke halaman ini.'; lobbyView = 'online'; renderLobby(); return; }
    lsSet('mn_room', code); attachRoom(code); return;
  }
  if (st.players.some(p => p.id === myId)) { lsSet('mn_room', code); attachRoom(code); return; }
  pendingRoom = st; lobbyView = 'takeover'; renderLobby();
}
function attachRoom(code) {
  if (unsub) unsub();
  mode = 'online'; S0 = null; shownSeq = -1; queue.length = 0;
  roomRef = DB.doc('rooms/' + code);
  unsub = roomRef.onSnapshot(snap => {
    if (!snap.exists) return;
    const st = JSON.parse(JSON.stringify(snap.data()));
    if (st.phase === 'lobby') { if (lobbyView !== 'waiting') { lobbyView = 'waiting'; renderLobby(); } return; }
    if (lobbyView !== 'none') enterGame();
    receive(st);
  }, () => toast('Koneksi ke room terputus. Muat ulang halaman.'));
}

// Penyimpanan room lewat server WebSocket sendiri (/ws di domain yang sama).
// Bentuknya meniru db artifact (doc().get/set/onSnapshot) supaya kode lobby & game tidak perlu tahu bedanya.
function wsDB(url) {
  let ws = null, open = false, closed = false, everOpen = false, nextId = 1;
  const pending = {}, subs = {}, outbox = [];
  const opened = new Promise(res => {
    const connect = () => {
      if (closed) return;
      try { ws = new WebSocket(url); } catch (e) { res(false); return; }
      ws.onopen = () => {
        open = true; everOpen = true; res(true);
        for (const code in subs) ws.send(JSON.stringify({ t:'sub', code }));
        while (outbox.length) ws.send(outbox.shift());
      };
      ws.onmessage = ev => {
        let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
        if (m.t === 'res' && pending[m.id]) {
          const p = pending[m.id]; delete pending[m.id]; clearTimeout(p.timer);
          m.ok ? p.resolve(m) : p.reject({ code:m.error || 'unavailable', message:m.error || 'gagal' });
        } else if (m.t === 'snap' && subs[m.code]) {
          subs[m.code]({ exists:m.data != null, data:() => m.data });
        }
      };
      // sambung ulang hanya jika sebelumnya pernah tersambung; kalau sejak awal gagal, berarti tidak ada server
      ws.onclose = () => { open = false; if (!everOpen) { closed = true; res(false); } else if (!closed) setTimeout(connect, 1500); };
    };
    connect();
  });
  const raw = msg => { const s = JSON.stringify(msg); open ? ws.send(s) : outbox.push(s); };
  const request = msg => new Promise((resolve, reject) => {
    const id = nextId++;
    const timer = setTimeout(() => { delete pending[id]; reject({ code:'unavailable', message:'timeout' }); }, 8000);
    pending[id] = { resolve, reject, timer };
    raw(Object.assign({ id }, msg));
  });
  return {
    opened,
    close() { closed = true; if (ws) ws.close(); },
    doc(p) {
      const code = p.split('/')[1];
      return {
        get: () => request({ t:'get', code }).then(r => ({ exists:r.exists, data:() => r.data })),
        set: data => request({ t:'set', code, data }).then(() => {}),
        onSnapshot(next) {
          subs[code] = next; raw({ t:'sub', code });
          return () => { delete subs[code]; raw({ t:'unsub', code }); };
        },
      };
    },
  };
}
// pesan untuk penolakan dari server room (batas pengaman), selain itu pesan bawaan
function serverErr(e, fallback) {
  const code = e && e.code;
  if (code === 'server_full') return 'Server sedang penuh. Coba lagi beberapa saat lagi.';
  if (code === 'rate_limited') return 'Terlalu banyak permintaan. Tunggu sebentar lalu coba lagi.';
  if (code === 'too_large') return 'Data permainan terlalu besar untuk dikirim.';
  return fallback;
}
async function probeWs() {
  if (!/^https?:$/.test(location.protocol)) return null;
  const db = wsDB((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
  const ok = await Promise.race([db.opened, sleep(4000).then(() => false)]);
  if (!ok) { db.close(); return null; }
  return db;
}
let onlineKind = null; // 'artifact' | 'server'
async function initOnline() {
  // di claude.ai pakai penyimpanan artifact; di domain sendiri baru coba server /ws
  let tries = 0;
  while (!(window.claude && window.claude.use) && tries < 15) { await sleep(200); tries++; }
  try { DB = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { DB = null; }
  if (DB) onlineKind = 'artifact';
  else if (!window.claude) { DB = await probeWs(); onlineKind = DB ? 'server' : null; }
  onlineState = DB ? 'ready' : 'off';
  if (lobbyView === 'home') renderLobby();
}

/* ---- Mulai ---- */
document.querySelectorAll('[data-music]').forEach(el => el.setAttribute('aria-pressed', musicOn));
renderLobby();
layout(); resetCam(true);
requestAnimationFrame(frame);
initOnline();
})();
</script>
